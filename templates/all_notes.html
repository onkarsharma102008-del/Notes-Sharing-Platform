<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Notes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: url("{{ url_for('static', filename='images/background.jpg') }}") no-repeat center center/cover;
            height:100vh;
        }

        .card{
            border-radius:15px;
            margin-top:20px;
            box-shadow:0 2px 10px black;
        }

        .pdf-icon{
            width:55px;
        }

        .badge{
            margin-right:5px;
        }

        .note-row{
            padding:15px;
            border-bottom:1px solid #ddd;
        }

        .note-row:last-child{
            border-bottom:none;
        }
    </style>
</head>

<body>

     <nav class="navbar">
            <div class="logo">
                 Notes Sharing Platform 
            </div>
            <div class="menu">
            <a href="/">Home</a>|
            <a href="/profile">profile</a>|
            <a href="/upload">upload notes</a>|
            <a href="/logout">Logout</a>

        </div>
        </nav>

<div class="container mt-4">

<div class="card">

<div class="card-body">

<h2 class="mb-4">All Notes</h2>

<form method="GET">

<div class="row">

<div class="col-md-10">
<input type="text" class="form-control"
name="search"
placeholder="Search by title or subject">
</div>

<div class="col-md-2">
<button class="btn btn-primary w-100">
Search
</button>
</div>

</div>

</form>

<hr>

{% for note in notes %}

<div class="row align-items-center note-row">

    <div class="col-md-1">
        <img src="{{ url_for('static', filename='images/pdf.png') }}" class="pdf-icon">
    </div>

    <div class="col-md-7">

        <h5>{{ note.title }}</h5>

        <span class="badge bg-primary">
            {{ note.subject }}
        </span>

        <span class="badge bg-success">
            {{ note.semester }}
        </span>

        <br><br>

        <small class="text-muted">
            Uploaded By: <b>{{ note.username }}</b>
        </small>

        <br>

        <small class="text-muted">
            Uploaded Date: <b>{{ note.upload_date }}</b>
        </small>

    </div>

    <div class="col-md-2">
       <a href="{{ url_for('download', filename=note['filename']) }}" class="btn btn-success">
    Download
</a>
    </div>

</div>

{% endfor %}

</div>

</div>

</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Download Notes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .card{
            margin-top:30px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,.15);
        }

        .pdf{
            width:60px;
        }
    </style>
</head>

<body>

<div class="container">

<div class="card">

<div class="card-body">

<h2 class="mb-4">Download Notes</h2>

{% for note in notes %}

<div class="row align-items-center border-bottom py-3">

<div class="col-md-1">
<img src="{{ url_for('static', filename='images/pdf.png') }}" class="pdf">
</div>

<div class="col-md-7">

<h5>{{ note.title }}</h5>

<p>{{ note.subject }}</p>

<span class="badge bg-success">{{ note.semester }}</span>

</div>

<div class="col-md-2">

<a href="{{ url_for('download', filename=note.filename) }}"
class="btn btn-success">
Download
</a>

</div>

</div>

{% endfor %}

</div>

</div>

</div>

</body>
</html>

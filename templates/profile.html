<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
     <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">


<nav class="navbar">
            <div class="logo">
                 Notes Sharing Platform 
            </div>
            <div class="menu">
            <a href="/">Home</a>|
            <a href="/profile">Profile</a>|
            <a href="/notes">All Notes</a>|
            <a href="/upload">Upload Notes</a>|
            <a href="/logout">Logout</a>|
           
        </div>
        </nav>

<div class="container mt-5">

<div class="row">


<div class="col-md-3">

<div class="card text-center shadow">

<div class="card-body">
<img src="{{ url_for('static', filename='images/profile.png') }}" class="profile-img">
<!-- <img src="https://media.istockphoto.com/id/2151669184/vector/vector-flat-illustration-in-grayscale-avatar-user-profile-person-icon-gender-neutral.jpg?s=2048x2048&w=is&k=20&c=mwUeVWLqj8MiuGo3ZjStxTvHdVab26OtVitg65Gz0B8="
class="rounded-circle mb-3"> -->

<h4>{{ user[0] }}</h4>

<p>{{ user[2] }}</p>

<hr>

<a href="/profile" class="btn btn-primary w-100 mb-2">My Notes</a>

<a href="/edit-profile" class="btn btn-warning w-100 mb-2">Edit Profile</a>

<a href="/change-password" class="btn btn-secondary w-100">Change Password</a>

</div>

</div>

</div>


<div class="col-md-9">

<div class="card shadow">

<div class="card-header bg-primary text-white">
<h3>My Notes</h3>
</div>

<div class="card-body">

<table class="table table-bordered table-hover">

<thead>

<tr>

<th>#</th>

<th>Title</th>

<th>Subject</th>

<th>Semester</th>

<th>Action</th>
</tr>

</thead>

<tbody>
{% for note in notes %}
<tr>
    <td>{{ note[0] }}</td>
    <td>{{ note[1] }}</td>
    <td>{{ note[2] }}</td>
    <td>{{ note[3]}}</td>
    <td>
    <a href="{{ url_for('edit', id=note[0]) }}" class="btn btn-warning btn-sm">
        Edit
    </a>

    <a href="{{ url_for('delete', id=note[0]) }}"
       class="btn btn-danger btn-sm"
       onclick="return confirm('Are you sure you want to delete this note?')">
        Delete
    </a>
    </td>
</tr>
{% endfor %}
</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

</body>

</html>

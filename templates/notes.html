<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Notes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar">
    <div class="logo">
        Notes Sharing Platform
    </div>

    <div class="menu">
        <a href="/">Home</a> |
        <a href="/profile">Profile</a> |
        <a href="/upload">Upload Notes</a> |
        <a href="/logout">Logout</a>
    </div>
</nav>

<div class="container mt-4">

    <h2 class="fw-bold mb-4">All Notes</h2>

    <!-- Search -->
    <form class="row mb-4" method="GET">
        <div class="col-md-10">
            <input
                type="text"
                class="form-control"
                name="search"
                value="{{ request.args.get('search','') }}"
                placeholder="Search by title or subject...">
        </div>

        <div class="col-md-2">
            <button class="btn btn-primary w-100">
                Search
            </button>
        </div>
    </form>

    {% if notes %}

        {% for note in notes %}

        <div class="card shadow-sm mb-3">
            <div class="card-body d-flex justify-content-between align-items-center">

                <div class="d-flex">

                    <img src="{{ url_for('static', filename='images/pdf.png') }}"
                         width="55"
                         class="me-3">

                    <div>

                        <h5>{{ note[1] }}</h5>

                        <span class="badge bg-primary">{{ note[2] }}</span>
                        <span class="badge bg-success">{{ note[3] }}</span>

                        <p class="text-muted mt-2">
                            <strong>File:</strong> {{ note[4] }}
                        </p>

                        <small class="text-secondary">
                            Uploaded by <b>{{ note[5] }}</b><br>
                            Uploaded Date: <b>{{ note[6] }}</b>
                        </small>

                        <br><br>

                        <a href="/download/{{ note[4] }}" class="btn btn-success btn-sm">
                            Download
                        </a>

                    </div>

                </div>

            </div>
        </div>

        {% endfor %}

    {% else %}

        <div class="alert alert-warning text-center">
            No Notes Available.
        </div>

    {% endif %}

</div>

</body>
</html>
